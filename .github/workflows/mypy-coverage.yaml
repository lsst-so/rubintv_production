name: "mypy coverage"

# Runs https://github.com/mfisherlevine/mypy_coverage on every PR and on
# pushes to main. Gates annotation coverage at 100% (``--threshold 100``
# on the fully-typed metric): the job fails if any callable in the tree
# is not fully annotated. This mirrors the local mypy-coverage pre-commit
# hook, so the 100% floor is enforced both before commit and on the
# server. The job also surfaces inline annotations on the PR diff for
# unannotated / partially annotated definitions, plus a markdown coverage
# report posted as a sticky PR comment.
#
# Note: a failing run only *blocks* a merge once this job is added to the
# required status checks for ``main`` in the branch protection settings.

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: "Annotate coverage gaps"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - id: mc
        uses: mfisherlevine/mypy_coverage@v0.2.3
        with:
          version: "0.2.3"
          format: github
          # Gate at 100% on the fully-typed metric, matching the local
          # mypy-coverage pre-commit hook. This step (and so the job)
          # fails if coverage drops below the threshold.
          threshold: "100"
          threshold-metric: fully-typed
          # Use the repo's mypy.ini directly so we pick up the same
          # exclude pattern, files=, and mypy_path= as the local mypy run.
          config: mypy.ini
          # Drop the walled-off "Excluded files" section: it's noise in
          # the PR comment and reviewers don't act on it.
          include-excluded: "false"
      - name: "Build markdown report"
        if: always()
        # The action above pip-installs mypy-coverage, so the CLI is on
        # PATH for the rest of the job. Re-run it here in markdown mode
        # to produce a body we can post as a sticky PR comment.
        run: |
          mypy-coverage \
            --color never \
            --format markdown \
            --no-include-excluded \
            --config mypy.ini \
            > "$RUNNER_TEMP/mypy-coverage.md" \
            || true
      - name: "Coverage summary"
        if: always()
        run: cat "$RUNNER_TEMP/mypy-coverage.md" >> "$GITHUB_STEP_SUMMARY"
      - name: "Post sticky PR comment (recreated each run)"
        # ``recreate: true`` deletes the previous comment and posts a
        # fresh one each run, so the new comment gets a current
        # timestamp and the PR conversation always renders it at the
        # bottom (after every commit) instead of stranded at the top
        # where it first appeared.
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: mypy-coverage-report
          recreate: true
          path: ${{ runner.temp }}/mypy-coverage.md
