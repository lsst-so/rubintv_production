name: "Build and Push"

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

jobs:

  build:
    name: "Build and Push Application Container Images"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Derive image tag
        id: tag
        shell: bash
        # Mirrors the previous docker-tag.sh: HEAD_REF on PRs, REF_NAME on
        # branch / tag pushes, with ``/`` collapsed to ``-``.
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_HEAD_REF:-}" ]; then
            ref="${GITHUB_HEAD_REF}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          echo "tag=${ref//\//-}" >> "$GITHUB_OUTPUT"

      # Under the default image store dockerd's memory grows with the
      # layers it exports, and a cold build of this image takes it past
      # the runner's 16 GB.
      - name: Use the containerd image store
        run: |
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info | grep driver-type

      - name: "Match dependency ticket branches"
        id: deps
        shell: bash
        # Cross-repo tickets: a change here often needs an unmerged change in
        # summit_utils (or ts_wep, ...), but the Dockerfile pins those repos to
        # a fixed ref, so mypy and pytest fail on the missing code until the
        # other repo has merged and the pin has been bumped -- i.e. the PR can
        # never be green when it is reviewed. So, on a ``tickets/`` PR, if a
        # dependency repo has a branch of the same name, build against that
        # branch instead of the pinned ref. Only PR builds are affected; tag
        # builds (the images that actually get deployed) always use the pins.
        run: |
          set -euo pipefail
          ref="${GITHUB_HEAD_REF:-}"
          args=""
          if [[ "${ref}" == tickets/* ]]; then
            for pair in \
              summit_utils=lsst-so/summit_utils \
              summit_extras=lsst-so/summit_extras \
              ts_wep=lsst-ts/ts_wep \
              donut_viz=lsst-ts/donut_viz; do
              name="${pair%%=*}"
              repo="${pair#*=}"
              if git ls-remote --exit-code --heads \
                  "https://github.com/${repo}.git" "${ref}" > /dev/null 2>&1; then
                echo "Overriding ${name}_ref: building against ${repo}@${ref}"
                args+="${name}_ref=${ref}"$'\n'
              fi
            done
          fi
          if [ -z "${args}" ]; then
            echo "No dependency ticket branches matched; using the Dockerfile pins."
          fi
          {
            echo "build-args<<DEPS_EOF"
            printf '%s' "${args}"
            echo "DEPS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Empty unless the step above matched a dependency ticket branch.
          build-args: ${{ steps.deps.outputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            type=registry,ref=ghcr.io/${{ github.repository }}:main
          cache-to: type=inline

      - name: "Run mypy"
        shell: bash
        run: |
          set -eo pipefail
          docker run --rm --user root -e HOME=/home/saluser \
            "${{ steps.meta.outputs.tags }}" \
            'git config --global --add safe.directory "*" && source /repos/.startup.sh && cd /repos/rubintv_production && mypy'

      - name: "Run pytest with coverage"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ci-out"
          docker run --rm --user root -e HOME=/home/saluser \
            -v "${GITHUB_WORKSPACE}/ci-out":/ci-out \
            "${{ steps.meta.outputs.tags }}" \
            'git config --global --add safe.directory "*" && source /repos/.startup.sh && cd /repos/rubintv_production && pytest -n auto --cov=lsst.rubintv.production --cov-report=xml:/ci-out/coverage.xml --cov-report=term tests/'

      - name: "Upload coverage to Codecov"
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: ./ci-out/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
