name: "Build and Push"

"on":
  pull_request:
    branches:
      - main
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:

  build:
    name: "Build and Push Application Container Images"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Derive image tag
        id: tag
        shell: bash
        # Mirrors the previous docker-tag.sh: HEAD_REF on PRs, REF_NAME on
        # branch / tag pushes, with ``/`` collapsed to ``-``.
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_HEAD_REF:-}" ]; then
            ref="${GITHUB_HEAD_REF}"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          echo "tag=${ref//\//-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          cache-to: type=inline

      - name: "Run mypy"
        shell: bash
        run: |
          set -eo pipefail
          docker run --rm --user root -e HOME=/home/saluser \
            "${{ steps.meta.outputs.tags }}" \
            'git config --global --add safe.directory "*" && source /repos/.startup.sh && cd /repos/rubintv_production && mypy'

      - name: "Run pytest with coverage"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/ci-out"
          docker run --rm --user root -e HOME=/home/saluser \
            -v "${GITHUB_WORKSPACE}/ci-out":/ci-out \
            "${{ steps.meta.outputs.tags }}" \
            'git config --global --add safe.directory "*" && source /repos/.startup.sh && cd /repos/rubintv_production && pytest -n auto --cov=lsst.rubintv.production --cov-report=xml:/ci-out/coverage.xml --cov-report=term tests/'

      - name: "Upload coverage to Codecov"
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: ./ci-out/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
