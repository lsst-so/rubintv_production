description: |
    Rapid analysis bias verification for LSSTCam.

    drp_pipe's quickLook bias pipeline plus the analysis_tools task that
    turns its merged results into a MetricMeasurementBundle for Sasquatch.
    The head node runs the per-detector labels as step1a and the rest as
    step1b (processingControl.CALIBRATION_PIPELINE_LABELS).
instrument: lsst.obs.lsst.LsstCam
imports:
  - location: $DRP_PIPE_DIR/pipelines/LSSTCam/quickLookBias.yaml
  - location: $ANALYSIS_TOOLS_DIR/pipelines/cpCore.yaml
    include:
      - analyzeBiasCore
