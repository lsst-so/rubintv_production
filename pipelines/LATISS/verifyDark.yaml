description: |
    Rapid analysis dark verification for LATISS.

    drp_pipe's quickLook dark pipeline plus the analysis_tools task that
    turns its merged results into a MetricMeasurementBundle for Sasquatch.
    The head node runs the per-detector labels as step1a and the rest as
    step1b (processingControl.CALIBRATION_PIPELINE_LABELS).
instrument: lsst.obs.lsst.Latiss
imports:
  - location: $DRP_PIPE_DIR/pipelines/LATISS/quickLookDark.yaml
  - location: $ANALYSIS_TOOLS_DIR/pipelines/cpCore.yaml
    include:
      - analyzeDarkCore
